name: gerards_paddestoelen_wegwijzer
description: Offline-first mycology identification and training app.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  crypto: ^3.0.6
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.4.2+1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/traits/bruising/
    - assets/images/traits/cap_color/
    - assets/images/traits/cap_shape/
    - assets/images/traits/cap_surface/
    - assets/images/traits/ecological_role/
    - assets/images/traits/flesh_colour/
    - assets/images/traits/fruitbody_form/
    - assets/images/traits/gill_attachment/
    - assets/images/traits/gill_spacing/
    - assets/images/traits/growth_position/
    - assets/images/traits/habitat_tree_group/
    - assets/images/traits/hymenium/
    - assets/images/traits/ring/
    - assets/images/traits/ring_form/
    - assets/images/traits/spore_print/
    - assets/images/traits/stem_base_shape/
    - assets/images/traits/stem_surface/
    - assets/images/traits/substrate/
    - assets/images/traits/volva/
    - assets/images/traits/volva_form/
    - assets/data/
