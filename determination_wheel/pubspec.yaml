name: mushroom_determination_wheel
description: Visual branching mushroom determination wheel based on the supplied mycology source material.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/splash.png
    - assets/illustrations/
    - assets/data/
