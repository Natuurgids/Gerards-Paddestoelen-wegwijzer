name: Full catalogue offline reference images

on:
  workflow_dispatch:
  push:
    branches:
      - feature/full-catalogue-offline-images
    paths:
      - .github/workflows/full-catalogue-reference-images.yml
      - tool/collect_inaturalist_reference_images.py
      - tool/merge_reference_image_batches.py

permissions:
  contents: read
  actions: read

concurrency:
  group: full-catalogue-reference-images
  cancel-in-progress: false

jobs:
  collect:
    name: collect-full-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: Install image tooling
        run: python3 -m pip install Pillow

      - name: Restore latest collection progress
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference-image-shards
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=full-catalogue-reference-image-progress&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "$artifact_id" ]; then
            echo "No previous progress artifact found; starting a fresh catalogue pass."
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Restoring progress artifact ${artifact_id}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/reference-progress.zip
          unzip -q -o /tmp/reference-progress.zip -d build/reference-image-shards
          echo "restored=true" >> "$GITHUB_OUTPUT"

      - name: Generate catalogue once when needed
        run: |
          if [ ! -s build/reference-image-shards/catalog/species_catalog.json ]; then
            python3 tool/build_nsr_fungi_catalog.py --min-species 10000
            mkdir -p build/reference-image-shards/catalog
            cp assets/data/species_catalog.json build/reference-image-shards/catalog/species_catalog.json
          else
            echo "Reusing catalogue from previous collection progress."
          fi

      - name: Collect and retry only unfinished species
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reference-image-shards/images build/reference-image-shards/reports

          # Pass 1 resumes all prior completed/unavailable records and queries only
          # species that have never completed or previously failed transiently.
          # Later passes retry only transient failures. Successfully downloaded
          # JPEGs and confirmed unavailable species are never recollected.
          for pass in 1 2 3 4 5 6; do
            echo "=== retry pass ${pass}/6 ==="
            retryable=0
            for batch in $(seq 0 15); do
              report="build/reference-image-shards/reports/batch-${batch}.json"
              python3 tool/collect_inaturalist_reference_images.py \
                --catalog build/reference-image-shards/catalog/species_catalog.json \
                --output-dir build/reference-image-shards/images \
                --report "$report" \
                --batch-index "$batch" \
                --batch-count 16 \
                --delay 1.25 \
                --resume
              batch_retryable="$(python3 - "$report" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as fh:
              print(int(json.load(fh).get('retryable_errors', 0)))
          PY
              )"
              retryable=$((retryable + batch_retryable))
            done
            echo "retryable failures remaining after pass ${pass}: ${retryable}"
            if [ "$retryable" -eq 0 ]; then
              break
            fi
            if [ "$pass" -lt 6 ]; then
              echo "Backing off before retrying transient failures."
              sleep $((pass * 60))
            fi
          done

      - name: Preserve collection progress
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-catalogue-reference-image-progress
          path: |
            build/reference-image-shards/catalog/species_catalog.json
            build/reference-image-shards/images/
            build/reference-image-shards/reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Merge current collection state
        if: always()
        run: |
          python3 tool/merge_reference_image_batches.py \
            --input-dir build/reference-image-shards \
            --output-dir build/offline-reference-images \
            --report build/full-catalogue-reference-images.json

      - name: Show collection totals
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/full-catalogue-reference-images.json')
          if not path.exists():
              raise SystemExit('No merged report was produced')
          data = json.loads(path.read_text(encoding='utf-8'))
          for key in (
              'catalog_species_considered',
              'species_with_offline_image',
              'species_missing_usable_image',
              'retryable_errors',
          ):
              print(f'{key}: {data.get(key)}')
          PY

      - name: Upload current offline media pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-catalogue-offline-reference-images
          path: |
            build/offline-reference-images/
            build/full-catalogue-reference-images.json
          if-no-files-found: warn
          retention-days: 14
