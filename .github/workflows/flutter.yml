name: Flutter CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create . --platforms=android,ios --project-name gerards_paddestoelen_wegwijzer --org nl.natuurgids
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Dutch Species Register Fungi catalogue
        run: python3 tool/build_nsr_fungi_catalog.py --min-species 10000
      - name: Inspect NSR threat status fields
        run: python3 tool/inspect_nsr_threat_status.py
      - name: Enrich English and German vernacular names
        run: python3 tool/enrich_vernacular_names.py --min-de 100 --min-en 10
      - name: Enrich IUCN conservation status
        run: python3 tool/enrich_conservation_status.py --min-matches 1
      - name: Verify reviewed source snapshot
        run: python3 tool/verify_source_snapshot_lock.py
      - name: Generate packaged reference database
        run: REFERENCE_DATABASE_OUTPUT=assets/data/reference.sqlite flutter test tool/reference_database_builder_test.dart
      - name: Generate launcher icon source
        run: python3 tool/generate_app_icon.py
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android release APK
        run: flutter build apk --release
      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: gerards-paddestoelen-wegwijzer-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
