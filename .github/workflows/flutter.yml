name: Flutter CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'test/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate platform scaffolding
        run: flutter create . --platforms=android,ios --project-name gerards_paddestoelen_wegwijzer --org nl.natuurgids
      - name: Configure release platform floors
        run: python3 tool/configure_generated_platforms.py
      - name: Test release platform floor configurator
        run: python3 -m unittest tool/test_configure_generated_platforms.py
      - name: Test paid learning package publisher
        run: python3 -m unittest tool/test_publish_learning_packages.py
      - name: Test ecology enrichment
        run: PYTHONPATH=tool python3 -m unittest tool/test_enrich_ecology.py
      - name: Install image tooling
        run: python3 -m pip install Pillow
      - name: Validate supplied brand assets
        run: python3 tool/validate_brand_assets.py
      - name: Install dependencies
        run: flutter pub get
      - name: Restore reviewed vernacular source pages
        uses: actions/cache@v4
        with:
          path: .cache/source-enrichment
          key: vernacular-source-pages-v1
      - name: Test vernacular source cache
        run: python3 -m unittest tool/test_enrich_vernacular_cache.py
      - name: Test source license lock
        run: python3 -m unittest tool/test_verify_source_snapshot_lock.py
      - name: Validate curated species reference sources
        run: python3 tool/validate_species_reference_sources.py
      - name: Generate Dutch Species Register Fungi catalogue
        run: python3 tool/build_nsr_fungi_catalog.py --min-species 10000
      - name: Enrich habitat and reviewed lookalikes
        run: python3 tool/enrich_ecology.py --min-habitat 100
      - name: Enrich English and German vernacular names
        run: python3 tool/enrich_vernacular_names.py --min-de 100 --min-en 10 --cache-dir .cache/source-enrichment
      - name: Enrich IUCN conservation status
        run: python3 tool/enrich_conservation_status.py --min-matches 1
      - name: Collect iNaturalist reference-image pilot
        run: python3 tool/collect_inaturalist_reference_images.py --limit 16 --delay 0.5
      - name: Upload iNaturalist reference-image pilot
        uses: actions/upload-artifact@v4
        with:
          name: inaturalist-reference-image-pilot
          path: |
            build/inaturalist-reference-images/
            build/inaturalist-reference-report.json
          if-no-files-found: error
          retention-days: 14
      - name: Verify reviewed source snapshot
        run: python3 tool/verify_source_snapshot_lock.py
      - name: Generate packaged reference database
        run: REFERENCE_DATABASE_OUTPUT=assets/data/reference.sqlite flutter test tool/reference_database_builder_test.dart
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Prepare collected species assets for Android release
        if: github.event_name == 'push'
        run: |
          python3 tool/prepare_nested_species_assets.py
          flutter pub get
      - name: Build Android release AAB
        if: github.event_name == 'push'
        run: flutter build appbundle --release
      - name: Verify Google Play release AAB
        if: github.event_name == 'push'
        run: python3 tool/verify_android_app_bundle.py
      - name: Upload Android release AAB
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gerards-paddestoelen-wegwijzer-android-play-release
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Build Android release APK
        if: github.event_name == 'push'
        run: flutter build apk --release
      - name: Verify species images in Android release APK
        if: github.event_name == 'push'
        shell: bash
        run: |
          EXPECTED_COUNT=$(find assets/images/species -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) | wc -l)
          export EXPECTED_COUNT
          python3 - <<'PY'
          import os
          import zipfile

          apk = 'build/app/outputs/flutter-apk/app-release.apk'
          expected = int(os.environ['EXPECTED_COUNT'])
          with zipfile.ZipFile(apk) as archive:
              names = archive.namelist()
          prefixes = (
              'assets/flutter_assets/assets/images/species/',
              'flutter_assets/assets/images/species/',
          )
          actual = sum(
              1
              for name in names
              if name.lower().endswith(('.jpg', '.jpeg', '.png', '.webp'))
              and name.startswith(prefixes)
          )
          print(f'Committed species image assets: {expected}')
          print(f'Species image assets packaged in APK: {actual}')
          if actual != expected:
              raise SystemExit(f'APK species asset count mismatch: expected {expected}, found {actual}')
          PY
      - name: Upload Android release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: gerards-paddestoelen-wegwijzer-android-apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-release:
    if: github.event_name == 'push'
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Generate Windows scaffolding
        run: flutter create . --platforms=windows --project-name gerards_paddestoelen_wegwijzer --org nl.natuurgids
      - name: Install image tooling
        run: python -m pip install Pillow
      - name: Validate supplied brand assets
        run: python tool/validate_brand_assets.py
      - name: Validate curated species reference sources
        run: python tool/validate_species_reference_sources.py
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Windows launcher icon
        run: dart run flutter_launcher_icons -f tool/windows_launcher_icons.yaml
      - name: Generate Dutch Species Register Fungi catalogue
        run: python tool/build_nsr_fungi_catalog.py --min-species 10000
      - name: Enrich habitat and reviewed lookalikes
        run: python tool/enrich_ecology.py --min-habitat 100
      - name: Enrich IUCN conservation status
        run: python tool/enrich_conservation_status.py --min-matches 1
      - name: Generate packaged reference database
        shell: pwsh
        run: |
          $env:REFERENCE_DATABASE_OUTPUT = 'assets/data/reference.sqlite'
          flutter test tool/reference_database_builder_test.dart
      - name: Prepare collected species assets for Windows release
        run: |
          python tool/prepare_nested_species_assets.py
          flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Verify collected species images in Windows release
        run: python tool/verify_windows_species_assets.py
      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: gerards-paddestoelen-wegwijzer-windows-release
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
