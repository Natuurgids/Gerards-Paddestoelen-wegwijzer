name: Main photographic determination APK
on:
  push:
    branches: ['feature/photographic-wheel-apk-build']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-photographic-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Validate shared determination catalogue
        run: |
          python3 tool/validate_determination_catalogue.py
          python3 tool/validate_determination_keys.py
      - name: Generate main app platform scaffolding
        run: flutter create . --platforms=android,ios --project-name gerards_paddestoelen_wegwijzer --org nl.natuurgids
      - name: Configure release platform floors
        run: python3 tool/configure_generated_platforms.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze main app
        run: flutter analyze --fatal-infos
      - name: Test main app
        run: flutter test --reporter expanded
      - name: Upload actual main app interface renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-photographic-ui-verification
          path: build/main-interface-verification/
          if-no-files-found: warn
          retention-days: 14
      - name: Generate packaged reference database
        run: REFERENCE_DATABASE_OUTPUT=assets/data/reference.sqlite flutter test tool/reference_database_builder_test.dart
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Prepare offline species images
        run: |
          python3 tool/prepare_nested_species_assets.py
          flutter pub get
      - name: Build main app release APK
        run: flutter build apk --release
      - name: Record APK checksum and commit
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
          git rev-parse HEAD > build/app/outputs/flutter-apk/COMMIT.txt
      - name: Upload verified main app APK
        uses: actions/upload-artifact@v4
        with:
          name: gerards-paddestoelen-main-android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
            build/app/outputs/flutter-apk/COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Split APK for downloadable delivery
        run: split -b 200M -d build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/main-apk.part-
      - name: Upload APK delivery part 0
        uses: actions/upload-artifact@v4
        with:
          name: main-apk-delivery-part-0
          path: build/app/outputs/flutter-apk/main-apk.part-00
          compression-level: 0
      - name: Upload APK delivery part 1
        uses: actions/upload-artifact@v4
        with:
          name: main-apk-delivery-part-1
          path: build/app/outputs/flutter-apk/main-apk.part-01
          compression-level: 0
      - name: Upload APK delivery part 2
        uses: actions/upload-artifact@v4
        with:
          name: main-apk-delivery-part-2
          path: build/app/outputs/flutter-apk/main-apk.part-02
          compression-level: 0
